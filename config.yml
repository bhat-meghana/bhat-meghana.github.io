    profileMode:
          enabled: true
          title: Meghana Bhat
          subtitle: "I am a Research Fellow(PostDoc) hosted by <a href='https://sites.google.com/view/pduttashomepage' style='color: navy;'>Prof. Pranjal Dutta</a> in the College of Computing and Data Science(CCDS) at the Nanyang Technological University(NTU), Singapore. 
                    <br>
                     My research interest is in <i style='color: navy;'>Commutative algebra and Algebraic Geometry</i> and its applications to other fields like <i style='color: navy;'>Algebraic Complexity Theory</i>. In particular, I have worked on problems related to <i style='color: navy;'>Hilbert functions</i>, and <i style='color: navy;'>Waring rank of forms</i>.
                    <br>
                    <br>
                    I received my PhD in Mathematics from <a href='https://www.iitdh.ac.in' style='color: navy;'>Indian Institute of Technology Dharwad</a> in July 2026. 
                    My Ph.D. thesis advisor was <a href='https://www.iitdh.ac.in/user-profile/shreedevi-masuti' style='color: navy;'>Prof. Shreedevi Masuti</a>. 
                    I was also a SPARC visiting research student at the Politecnico Di Torino, Italy, under the mentorship of <a href='https://www.polito.it/personale?p=enrico.carlini' style='color: navy;'>Prof. Enrico Carlini</a>.
                    During my Ph.D., I was a <a href='/PMRFCerti.pdf' target='_blank' rel='noopener noreferrer' style='color: navy;'>Prime Minister's Research Fellow</a>. Funding from PMRF has been instrumental in my research journey.
                    <br>
                    <br>
                    Contact: mbhat.math@gmail.com, meghana.bhat@ntu.edu.sg
                    <br>"
          imageUrl: "profile_picture.jpeg"
          imageWidth: 160
